# XcodeGen spec: `xcodegen generate` (in apple/) makes Bookshelf.xcodeproj.
# The .xcodeproj itself isn't committed.
name: Bookshelf
options:
  bundleIdPrefix: io.github.e36lewis
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  BookshelfKit:
    path: BookshelfKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "0.9.0"
    # Which journal the app opens. Only a release build says Stable
    # (scripts/build-dmg.sh Stable passes BOOKSHELF_CHANNEL=Stable): it's
    # "Bookshelf", with the real bundle ID and journal. Every other build
    # is "Bookshelf Preview", with its own (see BuildChannel.swift).
    BOOKSHELF_CHANNEL: Preview
    BOOKSHELF_BUNDLE_ID_Stable: io.github.e36lewis.Bookshelf
    BOOKSHELF_BUNDLE_ID_Preview: io.github.e36lewis.Bookshelf.Preview
    # Ad-hoc signing (unsigned for Gatekeeper): no Developer ID for now.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Bookshelf:
    type: application
    platform: macOS
    sources:
      - path: Bookshelf
      # The bundled typefaces (SIL Open Font License), copied flat into
      # Resources/Fonts, where ATSApplicationFontsPath registers them for
      # this app only. Each license goes beside them.
      - path: ../packaging/fonts
        includes: ["**/*.ttf"]
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Fonts
      - path: ../packaging/fonts/ia-writer-duo/LICENSE.md
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Fonts/iA Writer Duo
      - path: ../packaging/fonts/source-serif-4/LICENSE.md
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Fonts/Source Serif 4
    dependencies:
      - package: BookshelfKit
    info:
      path: Bookshelf/Info.plist
      properties:
        CFBundleDisplayName: Bookshelf
        # From the build settings above, so About Bookshelf shows the real version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BookshelfChannel: $(BOOKSHELF_CHANNEL)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 e36lewis. Free software under the GPL 3.0 or later."
        ATSApplicationFontsPath: Fonts
    entitlements:
      path: Bookshelf/Bookshelf.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # Remembers the backup folder someone picks, across launches.
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        # Previews get their own ID (and so their own sandbox container),
        # so they never touch a real journal.
        PRODUCT_BUNDLE_IDENTIFIER: $(BOOKSHELF_BUNDLE_ID_$(BOOKSHELF_CHANNEL))
        PRODUCT_NAME: Bookshelf
        # Bookshelf/Assets.xcassets, from icon/AppIcon.svg (scripts/make-icons.sh).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BookshelfUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [BookshelfUITests]
    dependencies:
      - target: Bookshelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.e36lewis.Bookshelf.UITests
        TEST_TARGET_NAME: Bookshelf
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bookshelf:
    build:
      targets:
        Bookshelf: all
        BookshelfUITests: [test]
    test:
      targets: [BookshelfUITests]
