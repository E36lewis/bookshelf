<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Bookshelf's macOS app icon: the Linux icon (packaging/com.bookshelf.Bookshelf.svg)
    on Apple's icon grid. The body is a continuous-corner rounded rectangle,
    824 x 824 at (100, 100) with a 185.4 corner radius, over a soft shadow.
    apple/scripts/make-icons.sh renders it into AppIcon.appiconset.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0703f"/>
      <stop offset="1" stop-color="#9a3f1f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f6eee0"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <!-- shadow under the body -->
  <path d="M640.59 100C722.19 100 763 100 799.79 112.14L806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41L924 640.59C924 722.19 924 763 911.86 799.79L910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924L383.41 924C301.81 924 261 924 224.21 911.86L217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59L100 383.41C100 301.81 100 261 112.14 224.21L113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z" fill="#000" filter="url(#drop)"/>
  <!-- body -->
  <path d="M640.59 100C722.19 100 763 100 799.79 112.14L806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41L924 640.59C924 722.19 924 763 911.86 799.79L910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924L383.41 924C301.81 924 261 924 224.21 911.86L217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59L100 383.41C100 301.81 100 261 112.14 224.21L113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z" fill="url(#tile)"/>
  <path d="M640.59 100C722.19 100 763 100 799.79 112.14L806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41L924 640.59C924 722.19 924 763 911.86 799.79L910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924L383.41 924C301.81 924 261 924 224.21 911.86L217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59L100 383.41C100 301.81 100 261 112.14 224.21L113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z" fill="url(#sheen)"/>
  <path d="M640.59 100C722.19 100 763 100 799.79 112.14L806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41L924 640.59C924 722.19 924 763 911.86 799.79L910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924L383.41 924C301.81 924 261 924 224.21 911.86L217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59L100 383.41C100 301.81 100 261 112.14 224.21L113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="2"/>
  <!-- the book, drawn on the Linux icon's 128 grid -->
  <g transform="translate(100 100) scale(7.357) translate(-8 -8)">
    <!-- book shadow -->
    <rect x="36.5" y="30" width="64" height="78" rx="5" fill="#000" opacity="0.3" filter="url(#soft)"/>
    <!-- book -->
    <rect x="34" y="26" width="64" height="78" rx="5" fill="url(#page)"/>
    <path d="M39 26h4v78h-4a5 5 0 0 1-5-5V31a5 5 0 0 1 5-5z" fill="#e7dcc8"/>
    <rect x="43" y="26" width="0.6" height="78" fill="#000" opacity="0.06"/>
    <!-- written lines -->
    <g fill="#c9bba3">
      <rect x="52" y="48" width="34" height="4" rx="2"/>
      <rect x="52" y="58" width="28" height="4" rx="2"/>
      <rect x="52" y="68" width="32" height="4" rx="2"/>
      <rect x="52" y="78" width="20" height="4" rx="2"/>
    </g>
    <!-- bookmark ribbon -->
    <path d="M78 26v38l7-6 7 6V26z" fill="#8a3819"/>
  </g>
</svg>
