# Tests the shared core on Linux, macOS and Windows, and the GTK app on Linux.
# Third-party actions are pinned to exact commits (the comment says which release).
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apple/**'
      - 'windows/Bookshelf/**'
      - 'windows/ci/**'
      - 'windows/PREVIEW-README.txt'
      - '.github/workflows/apple.yml'
      - '.github/workflows/windows.yml'
      - 'README.md'
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'apple/**'
      - 'windows/Bookshelf/**'
      - 'windows/ci/**'
      - 'windows/PREVIEW-README.txt'
      - '.github/workflows/apple.yml'
      - '.github/workflows/windows.yml'
      - 'README.md'
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    # Draft PRs don't build on every push; run the workflow by hand when ready.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Formatting (rustfmt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --all --check

  core:
    # Draft PRs don't build on every push; run the workflow by hand when ready.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Only the crates that build everywhere: the GTK app is Linux-only.
      - name: Clippy
        run: cargo clippy -p bookshelf-core -p bookshelf-cli -p bookshelf-ffi --all-targets -- -D warnings
      - name: Test
        run: cargo test -p bookshelf-core -p bookshelf-cli -p bookshelf-ffi

  linux-app:
    # Draft PRs don't build on every push; run the workflow by hand when ready.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Linux app (GTK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GTK 4 and libadwaita
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (all crates, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (all crates, all features)
        run: cargo test --workspace --all-features

  dotnet-linux:
    # Draft PRs don't build on every push; run the workflow by hand when ready.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # The Windows app's non-UI layer is plain .NET, so its tests also run
    # here against the Linux build of the core: quicker feedback than the
    # Windows job, which runs them too.
    name: Bookshelf.Core tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Rust core → libbookshelf_ffi.so
        run: cargo build --release -p bookshelf-ffi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Bookshelf.Core tests
        # windows/global.json selects the Microsoft Testing Platform runner.
        working-directory: windows
        run: dotnet test --project Bookshelf.Core.Tests/Bookshelf.Core.Tests.csproj

  bindings:
    # Draft PRs don't build on every push; run the workflow by hand when ready.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Bindings up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Regenerate the Swift and C# bindings
        run: scripts/gen-bindings.sh
      - name: Fail if they differ from what's committed
        run: git diff --exit-code -- apple/BookshelfKit windows/Bookshelf.Core/Generated
