# Builds and tests the macOS app, and keeps screenshots of it so the UI can
# be reviewed without a Mac (download the "mac-screenshots" artifact).
name: macOS app

on:
  push:
    branches: [main]
    paths:
      - 'apple/**'
      - 'bookshelf-core/**'
      - 'bookshelf-ffi/**'
      - 'tools/uniffi-bindgen/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'MANUAL.md'
      - 'packaging/**'
      - '.github/workflows/apple.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apple/**'
      - 'bookshelf-core/**'
      - 'bookshelf-ffi/**'
      - 'tools/uniffi-bindgen/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'MANUAL.md'
      - 'packaging/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mac:
    # Draft PRs don't build on every push; run the workflow by hand when ready.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Build, test, screenshot
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Rust core → xcframework
        run: apple/scripts/build-xcframework.sh

      - name: BookshelfKit tests
        run: swift test --package-path apple/BookshelfKit

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apple && xcodegen generate

      - name: UI tests (with screenshots)
        run: |
          xcodebuild test \
            -project apple/Bookshelf.xcodeproj -scheme Bookshelf \
            -destination 'platform=macOS' \
            -resultBundlePath apple/build/UITests.xcresult

      - name: Export screenshots
        if: always()
        run: |
          if [ -d apple/build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path apple/build/UITests.xcresult --output-path apple/build/screenshots
            # Files are exported under UUIDs; name them after their
            # attachments ("06-book-page-dark.png").
            cd apple/build/screenshots
            jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' manifest.json |
              while IFS=$'\t' read -r file nice; do
                # upload-artifact refuses " : < > | * ? in names.
                clean=$(printf '%s' "$nice" | sed -E 's/_[0-9]+_[0-9A-Fa-f-]{36}(\.[A-Za-z]+)$/\1/' |
                  tr '":<>|*?`/\\' '__________')
                [ -f "$file" ] && [ "$file" != "$clean" ] && mv -n -- "$file" "$clean"
              done
            ls
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mac-screenshots
          path: apple/build/screenshots
          if-no-files-found: ignore

      - name: Build the app (preview, ad-hoc signed)
        run: |
          xcodebuild build \
            -project apple/Bookshelf.xcodeproj -scheme Bookshelf -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath apple/build/dd
          # The bundled fonts and their licenses are in the app.
          fonts=apple/build/dd/Build/Products/Release/Bookshelf.app/Contents/Resources/Fonts
          ls -R "$fonts"
          test "$(find "$fonts" -maxdepth 1 -name '*.ttf' | wc -l)" -eq 8
          test -f "$fonts/iA Writer Duo/LICENSE.md"
          test -f "$fonts/Source Serif 4/LICENSE.md"
          # The app icon, from the asset catalog.
          contents=apple/build/dd/Build/Products/Release/Bookshelf.app/Contents
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$contents/Info.plist")" = AppIcon
          test -s "$contents/Resources/AppIcon.icns"
          # The version is project.yml's MARKETING_VERSION, not XcodeGen's 1.0.
          want=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' apple/project.yml)
          test -n "$want"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$contents/Info.plist")" = "$want"
          ditto -c -k --keepParent \
            apple/build/dd/Build/Products/Release/Bookshelf.app apple/build/Bookshelf-mac-preview.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Bookshelf-mac-preview
          path: apple/build/Bookshelf-mac-preview.zip
