# Builds and tests the macOS app, and keeps screenshots of it so the UI can
# be reviewed without a Mac (download the "mac-screenshots" artifact).
name: macOS app

on:
  push:
    branches: [main]
    paths:
      - 'apple/**'
      - 'bookshelf-core/**'
      - 'bookshelf-ffi/**'
      - 'tools/uniffi-bindgen/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'MANUAL.md'
      - 'packaging/**'
      - '.github/workflows/apple.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apple/**'
      - 'bookshelf-core/**'
      - 'bookshelf-ffi/**'
      - 'tools/uniffi-bindgen/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'MANUAL.md'
      - 'packaging/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:
  # release.yml builds the release (channel Stable) with this workflow.
  workflow_call:
    inputs:
      channel:
        description: Stable for a release (the real journal); anything else builds a preview
        type: string
        default: Preview

permissions:
  contents: read

concurrency:
  group: apple-${{ inputs.channel || 'Preview' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Only release.yml asks for Stable; every other build is a preview.
  CHANNEL: ${{ inputs.channel == 'Stable' && 'Stable' || 'Preview' }}

jobs:
  mac:
    # Draft PRs don't build on every push; run the workflow by hand when ready.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Build, test, screenshot
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Rust core → xcframework
        run: apple/scripts/build-xcframework.sh

      - name: BookshelfKit tests
        run: swift test --package-path apple/BookshelfKit

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apple && xcodegen generate

      - name: UI tests (with screenshots)
        run: |
          xcodebuild test \
            -project apple/Bookshelf.xcodeproj -scheme Bookshelf \
            -destination 'platform=macOS' \
            -resultBundlePath apple/build/UITests.xcresult

      - name: Export screenshots
        if: always()
        run: |
          if [ -d apple/build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path apple/build/UITests.xcresult --output-path apple/build/screenshots
            # Files are exported under UUIDs; name them after their
            # attachments ("06-book-page-dark.png").
            cd apple/build/screenshots
            jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' manifest.json |
              while IFS=$'\t' read -r file nice; do
                # upload-artifact refuses " : < > | * ? in names.
                clean=$(printf '%s' "$nice" | sed -E 's/_[0-9]+_[0-9A-Fa-f-]{36}(\.[A-Za-z]+)$/\1/' |
                  tr '":<>|*?`/\\' '__________')
                [ -f "$file" ] && [ "$file" != "$clean" ] && mv -n -- "$file" "$clean"
              done
            ls
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mac-screenshots
          path: apple/build/screenshots
          if-no-files-found: ignore

      - name: Build the app and its disk image (Release, universal, ad-hoc signed)
        # Also checks the app: channel, bundle ID, version, fonts, icon,
        # signature and sandbox (see the script).
        run: apple/scripts/build-dmg.sh "$CHANNEL"

      - name: The app opens from the disk image, sandboxed, on its own journal
        run: |
          if [ "$CHANNEL" = Stable ]; then name=Bookshelf id=io.github.e36lewis.Bookshelf
          else name="Bookshelf Preview" id=io.github.e36lewis.Bookshelf.Preview; fi
          # Installed as someone would: dragged out of the disk image.
          mount=$(mktemp -d)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" apple/build/*.dmg
          test -L "$mount/Applications"
          ditto "$mount/$name.app" "/Applications/$name.app"
          hdiutil detach -quiet "$mount"
          since=$(mktemp)
          open "/Applications/$name.app"
          exe="/Applications/$name.app/Contents/MacOS/Bookshelf"
          for _ in $(seq 60); do pgrep -f "$exe" >/dev/null && break; sleep 1; done
          sleep 10
          pid=$(pgrep -f "$exe") || { echo "$name didn't open, or quit at once"; exit 1; }
          # The sandbox gives it a container of its own, named for the
          # bundle ID, and its journal is in there.
          journal="$HOME/Library/Containers/$id/Data/Library/Application Support/$id"
          ls -la "$journal"
          kill $pid
          crashes=$(find ~/Library/Logs/DiagnosticReports -iname '*bookshelf*' -newer "$since" 2>/dev/null)
          if [ -n "$crashes" ]; then echo "$crashes"; exit 1; fi
          echo "$name opened from /Applications, with its journal in its own container."

      - name: Zip the preview for testers
        if: env.CHANNEL == 'Preview'
        run: |
          ditto -c -k --keepParent \
            apple/build/dd-Preview/Build/Products/Release/Bookshelf.app apple/build/Bookshelf-mac-preview.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.CHANNEL == 'Preview'
        with:
          name: Bookshelf-mac-preview
          path: apple/build/Bookshelf-mac-preview.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Bookshelf-mac-dmg-${{ env.CHANNEL }}
          path: apple/build/*.dmg
          if-no-files-found: error
