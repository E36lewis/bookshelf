# Builds the Windows app and uploads a test build (download the
# "Bookshelf-windows-preview-x64" artifact, unzip, run Bookshelf.exe; the
# exe is self-sufficient and can be moved anywhere).
name: Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build (x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Rust core → bookshelf_ffi.dll
        # Static C runtime: nothing extra (like the VC++ redistributable) to install.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p bookshelf-ffi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Bookshelf.Core tests
        # windows/global.json selects the Microsoft Testing Platform runner (.NET 10).
        working-directory: windows
        run: dotnet test --project Bookshelf.Core.Tests/Bookshelf.Core.Tests.csproj

      - name: Publish the app
        run: dotnet publish windows/Bookshelf/Bookshelf.csproj -c Release -r win-x64 -p:Platform=x64 -o windows/build/Bookshelf

      - name: Check the build is one self-sufficient Bookshelf.exe
        shell: pwsh
        run: |
          # People move the exe out of the folder (to the desktop, say), so
          # nothing else may be needed next to it. Debug symbols don't count.
          $extra = Get-ChildItem windows/build/Bookshelf -Recurse -File |
            Where-Object { $_.Name -ne 'Bookshelf.exe' -and $_.Extension -ne '.pdb' }
          if (-not (Test-Path windows/build/Bookshelf/Bookshelf.exe)) { throw "Bookshelf.exe is missing from the build" }
          if ($extra) { $extra.FullName; throw "Bookshelf.exe needs files next to it" }

      - name: Smoke test (the exe opens its window on its own, once)
        # Windows PowerShell, for its built-in UI Automation client.
        shell: powershell
        run: |
          # Run a copy that's alone in a new folder, as on someone's desktop,
          # and unpack into a fresh folder so nothing from the build helps.
          $alone = New-Item -ItemType Directory "$env:RUNNER_TEMP/Desktop copy"
          Copy-Item windows/build/Bookshelf/Bookshelf.exe $alone
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = "$env:RUNNER_TEMP/unpacked"
          $logs = Join-Path $env:LOCALAPPDATA 'Bookshelf Preview/logs'
          $crashLog = Join-Path $logs 'crash.log'
          $startupLog = Join-Path $logs 'startup.log'
          $title = 'Bookshelf Preview'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $app = Start-Process "$alone/Bookshelf.exe" -WorkingDirectory $env:RUNNER_TEMP -PassThru
          # Wait for the main window (first start unpacks ~230 MB), then a
          # little longer in case something fails just after it appears.
          while ($clock.Elapsed.TotalSeconds -lt 90 -and -not $app.HasExited) {
            $app.Refresh()
            if ($app.MainWindowTitle -eq $title) { break }
            Start-Sleep -Milliseconds 500
          }
          $opened = $clock.Elapsed.TotalSeconds
          # A first run (this PC has no journal yet) asks for a profile. A
          # journal that can't be opened shows "Bookshelf couldn't start".
          $heading = $null
          if ($app.MainWindowTitle -eq $title) {
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $window = [Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
            $ids = 'WelcomeHeading', 'ProblemTitle' | ForEach-Object {
              New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::AutomationIdProperty, $_)
            }
            $either = New-Object Windows.Automation.OrCondition($ids)
            while ($clock.Elapsed.TotalSeconds -lt $opened + 30 -and -not $heading) {
              $found = $window.FindFirst([Windows.Automation.TreeScope]::Descendants, $either)
              if ($found) { $heading = $found.Current.Name } else { Start-Sleep -Milliseconds 500 }
            }
          }
          Start-Sleep -Seconds 5
          # A second launch hands over to the open window and exits.
          $second = Start-Process "$alone/Bookshelf.exe" -WorkingDirectory $env:RUNNER_TEMP -PassThru
          $handedOver = $second.WaitForExit(30000)
          if (-not $handedOver) { Stop-Process -Id $second.Id -Force }
          Start-Sleep -Seconds 5
          if (Test-Path $startupLog) { Get-Content $startupLog }
          if ($app.HasExited) {
            if (Test-Path $crashLog) { Get-Content $crashLog }
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Format-List TimeCreated, ProviderName, Message
            throw "Bookshelf.exe exited on its own (exit code $($app.ExitCode))"
          }
          if (Test-Path $crashLog) { Get-Content $crashLog; throw "crash.log was written" }
          if ($app.MainWindowTitle -ne $title) { throw "No Bookshelf window after 90 seconds" }
          Stop-Process -Id $app.Id
          Write-Host "The window shows: $heading"
          if ($heading -ne 'Welcome') { throw "The first run didn't ask for a profile" }
          if (-not (Select-String -Path $startupLog -Pattern 'Ready: Rust core .* first run' -Quiet)) { throw "startup.log doesn't reach 'Ready'" }
          if (-not $handedOver -or $second.ExitCode -ne 0) { throw "A second Bookshelf.exe didn't hand over to the first and exit" }
          if (-not (Select-String -Path $startupLog -Pattern 'handed over to the open window' -SimpleMatch -Quiet)) { throw "The second launch didn't hand over" }
          # The bundled fonts load in this unpackaged single-file build.
          foreach ($font in 'Source Serif 4', 'iA Writer Duo S') {
            if (-not (Select-String -Path $startupLog -Pattern "Fonts: $font loads from" -SimpleMatch -Quiet)) { Write-Warning "$font didn't load" }
          }
          Write-Host ("Bookshelf.exe opened its window after {0:N1} s and stayed open." -f $opened)

      - name: Check the app can start on every Windows 10/11 PC
        shell: pwsh
        run: |
          # The runner has extras a normal PC may lack (the Visual C++
          # runtime, for one) and a newer Windows, so the smoke test alone
          # can't catch every problem. This checks the exe and what it
          # unpacked (exactly what a PC loads) for DLLs that aren't part of
          # Windows, and for the CET marking that stops .NET on older
          # Windows 10 (see scripts/check-windows-build.py).
          $unpacked = Get-ChildItem "$env:RUNNER_TEMP/unpacked/Bookshelf" -Directory | Select-Object -First 1
          if (-not $unpacked) { throw "Bookshelf.exe didn't unpack anything" }
          foreach ($f in 'Bookshelf.dll', 'bookshelf_ffi.dll', 'Bookshelf.pri') {
            if (-not (Test-Path (Join-Path $unpacked.FullName $f))) { throw "$f is missing from Bookshelf.exe" }
          }
          # Bookshelf.exe itself holds the .NET runtime, so check it too.
          python scripts/check-windows-build.py windows/build/Bookshelf/Bookshelf.exe $unpacked.FullName
          if ($LASTEXITCODE) { throw "check-windows-build.py failed" }

      - name: Add the read-me for testers
        shell: pwsh
        run: Copy-Item windows/PREVIEW-README.txt windows/build/Bookshelf/README.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Bookshelf-windows-preview-x64
          path: |
            windows/build/Bookshelf/Bookshelf.exe
            windows/build/Bookshelf/README.txt
          if-no-files-found: error

      - name: UI tour on demo journals, with screenshots
        # Never real data: each run makes a demo journal in a temporary
        # folder. Checks the pages through UI Automation and the keyboard,
        # and saves a screenshot of each (the next step uploads them).
        shell: powershell
        run: |
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = "$env:RUNNER_TEMP/unpacked"
          windows/ci/ui-tour.ps1 -Exe "$env:RUNNER_TEMP/Desktop copy/Bookshelf.exe" -Out "$env:RUNNER_TEMP/screenshots"

      - name: Show the app's logs
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'Bookshelf Preview/logs'
          foreach ($log in 'startup.log', 'crash.log', 'core.log') {
            $file = Join-Path $logs $log
            if (Test-Path $file) { Write-Host "--- $log"; Get-Content $file -Tail 200 }
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Bookshelf-windows-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
