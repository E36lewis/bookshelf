# Monthly pull requests for dependency updates (security fixes come sooner).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Pinned to the version uniffi-bindgen-cs (the C# bindings) supports;
      # upgrade both together, by hand, when the C# generator catches up.
      - dependency-name: "uniffi"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
