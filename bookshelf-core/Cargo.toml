[package]
name = "bookshelf-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
pulldown-cmark = { version = "0.13", default-features = false }
csv = { version = "1", optional = true }
log = "0.4.34"
# Reads a cover's size from its header. Only the formats we accept.
imagesize = { version = "0.15", default-features = false, features = ["gif", "jpeg", "png", "webp"] }

[features]
# One-off import of the old Rails app's CSV export. Not part of the app.
rails-import = ["dep:csv"]

[dev-dependencies]
tempfile = "3"
