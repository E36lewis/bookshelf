[package]
name = "bookshelf-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "bookshelf"
path = "src/main.rs"

[dependencies]
bookshelf-core = { path = "../bookshelf-core" }
chrono = "0.4"

[features]
# Enables `bookshelf import <dir>`:  cargo run -p bookshelf-cli --features rails-import -- import <dir>
rails-import = ["bookshelf-core/rails-import"]
