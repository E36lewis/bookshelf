[package]
name = "uniffi-bindgen"
version = "0.9.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Generates the Swift bindings for bookshelf-ffi (see scripts/gen-bindings.sh)."

[dependencies]
# Must match bookshelf-ffi's uniffi version exactly.
uniffi = { version = "=0.31.0", features = ["cli"] }
